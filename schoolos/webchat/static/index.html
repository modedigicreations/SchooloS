<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolOS</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2430; --muted: #6b7280;
    --accent: #2563eb; --border: #e5e7eb; --user-bg: #2563eb; --user-fg: #fff;
    --assist-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg); }
  .msg.assistant { align-self: flex-start; background: var(--assist-bg); border: 1px solid var(--border); }
  .msg.error { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  details.tools { align-self: flex-start; max-width: 85%; font-size: 12.5px; color: var(--muted); }
  details.tools summary { cursor: pointer; }
  details.tools pre { background: #f3f4f6; padding: 8px; border-radius: 8px; overflow-x: auto; max-height: 240px; }
  form#composer { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  #composer input { flex: 1; max-width: 760px; margin: 0 auto; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14.5px; }
  form#composer { max-width: 800px; width: 100%; margin: 0 auto; }
  button { padding: 10px 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 14.5px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .examples { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { background: var(--panel); color: var(--text); border: 1px solid var(--border); font-size: 13px; padding: 6px 10px; }
</style>
</head>
<body>
  <header>
    <h1>SchoolOS</h1>
    <p>Ask about students, assessments, attendance, or teachers — answers are computed from the ingested school data, not guessed.</p>
  </header>
  <div id="chat"></div>
  <form id="composer">
    <input id="input" type="text" placeholder="e.g. Which Primary 5 students are below expectations in Mathematics?" autocomplete="off">
    <button type="submit">Send</button>
  </form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('composer');
const input = document.getElementById('input');
let history = [];

const EXAMPLES = [
  "Which students are performing below expectations?",
  "Compare Primary 5 mathematics performance across the last three assessments",
  "Which teachers have the largest improvement in student outcomes?",
  "Draft an end-of-term report for Primary 6",
  "Generate an intervention plan for the bottom 10% of Primary 3",
];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addToolDetails(toolCalls) {
  if (!toolCalls || toolCalls.length === 0) return;
  const details = document.createElement('details');
  details.className = 'tools';
  const summary = document.createElement('summary');
  summary.textContent = `Data used (${toolCalls.length} call${toolCalls.length > 1 ? 's' : ''})`;
  details.appendChild(summary);
  const pre = document.createElement('pre');
  pre.textContent = toolCalls.map(tc => `${tc.name}(${JSON.stringify(tc.input)}) ->\n${JSON.stringify(tc.result, null, 2)}`).join('\n\n');
  details.appendChild(pre);
  chatEl.appendChild(details);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addExamples() {
  const wrap = document.createElement('div');
  wrap.className = 'examples';
  for (const ex of EXAMPLES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = ex;
    b.onclick = () => { input.value = ex; form.requestSubmit(); };
    wrap.appendChild(b);
  }
  chatEl.appendChild(wrap);
}

async function send(message) {
  addMessage('user', message);
  history.push({ role: 'user', text: message });
  const pending = addMessage('assistant', '…');
  input.value = '';
  input.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history: history.slice(0, -1) }),
    });
    const data = await res.json();
    if (!res.ok) {
      pending.className = 'msg error';
      pending.textContent = data.error || 'Something went wrong.';
    } else {
      pending.textContent = data.reply;
      history.push({ role: 'assistant', text: data.reply });
      addToolDetails(data.tool_calls);
    }
  } catch (err) {
    pending.className = 'msg error';
    pending.textContent = 'Network error: ' + err;
  } finally {
    input.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (message) send(message);
});

addExamples();
</script>
</body>
</html>
